[package]
name = "skribbl"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
eframe = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg", "bmp"] }
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }
